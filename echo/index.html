<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Echo</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #000; }
  </style>
  <script src="https://cdn.html.games.alexa.a2z.com/alexa-html/latest/alexa-html.js"></script>
</head>
<body>
  <iframe id="screen" title="Echo" allow="autoplay; fullscreen"></iframe>
  <script>
    (function () {
      var frame = document.getElementById('screen');
      function openScreen(url) {
        if (url && frame.getAttribute('src') !== url) {
          frame.src = url;
        }
      }
      var WRAPPER_VERSION = 2;
      var alexaClient = null;
      // Réponse différée de Lumi : l’écran demande de rouvrir le micro pour l’écoute de suite, sans redire « Echo ».
      // Sans confirmation d’ouverture en 1,5 s, la Skill s’en charge ; le résultat repart à l’écran pour le journal du Mac.
      window.addEventListener('message', function (event) {
        var data = event.data;
        if (!data || data.type !== 'lumi-open-microphone') return;
        if (!frame.src || new URL(frame.src).origin !== event.origin) return;
        var source = event.source;
        var report = function (result) {
          try {
            source.postMessage({ type: 'lumi-microphone-result', result: result, version: WRAPPER_VERSION }, event.origin);
          } catch (error) {}
        };
        var alexa = alexaClient;
        if (!alexa) {
          report('alexa-absent');
          return;
        }
        var done = false;
        var askSkill = function (why) {
          if (done) return;
          done = true;
          if (alexa.skill && typeof alexa.skill.sendMessage === 'function') {
            alexa.skill.sendMessage({ listen: true });
            report('message-skill:' + why);
          } else {
            report('aucune-voie:' + why);
          }
        };
        if (alexa.voice && typeof alexa.voice.requestMicrophoneOpen === 'function') {
          try {
            alexa.voice.requestMicrophoneOpen({
              onOpened: function () {
                if (done) return;
                done = true;
                report('micro-ouvert');
              },
              onClosed: function () {},
              onError: function (reason) { askSkill('erreur-' + reason); },
            });
            setTimeout(function () { askSkill('sans-confirmation'); }, 1500);
          } catch (error) {
            askSkill('exception');
          }
        } else {
          askSkill('api-absente');
        }
      });
      var params = new URLSearchParams(location.search);
      if (params.get('u')) {
        openScreen(params.get('u'));
      }
      if (window.Alexa && typeof window.Alexa.create === 'function') {
        window.Alexa.create({ version: '1.0' }).then(function (args) {
          var alexa = args.alexa;
          alexaClient = alexa;
          var message = args.message;
          if (message && message.screenUrl) {
            openScreen(message.screenUrl);
          }
          if (alexa && alexa.skill && typeof alexa.skill.onMessage === 'function') {
            alexa.skill.onMessage(function (incoming) {
              if (incoming && incoming.screenUrl) {
                openScreen(incoming.screenUrl);
              }
            });
          }
        }).catch(function () {});
      }
    })();
  </script>
</body>
</html>
